<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CinemaPass - Movie Ticket Booking</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #e11d48;
      --accent-hover: #be123c;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --seat-available: #334155;
      --seat-selected: #e11d48;
      --seat-occupied: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .booking-container {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 760px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 1.8rem;
      margin-bottom: 6px;
      color: var(--text);
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .movie-selection {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 28px;
    }

    label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
    }

    select {
      background-color: var(--bg-color);
      color: var(--text);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      font-size: 1rem;
      outline: none;
      cursor: pointer;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 28px;
      padding: 12px;
      background: rgba(15, 23, 42, 0.4);
      border-radius: 8px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .screen-container {
      perspective: 800px;
      margin-bottom: 30px;
      text-align: center;
    }

    .screen {
      background: linear-gradient(to bottom, #94a3b8, transparent);
      height: 60px;
      width: 80%;
      margin: 0 auto 10px auto;
      transform: rotateX(-35deg);
      border-radius: 8px;
      box-shadow: 0 15px 25px rgba(255, 255, 255, 0.15);
    }

    .screen-label {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .seating-chart {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      margin-bottom: 28px;
    }

    .seat-row {
      display: flex;
      gap: 10px;
    }

    .seat {
      width: 26px;
      height: 24px;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
      background-color: var(--seat-available);
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .seat:hover:not(.occupied) {
      transform: scale(1.15);
    }

    .seat.selected {
      background-color: var(--seat-selected);
    }

    .seat.occupied {
      background-color: var(--seat-occupied);
      cursor: not-allowed;
      opacity: 0.4;
    }

    .seat-row .seat:nth-child(2),
    .seat-row .seat:nth-child(6) {
      margin-right: 18px;
    }

    .summary-card {
      border-top: 1px solid #334155;
      padding-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .summary-text {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .summary-text span {
      color: var(--text);
      font-weight: 600;
    }

    .total-price {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
      margin-top: 4px;
    }

    .book-btn {
      background-color: var(--accent);
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .book-btn:hover {
      background-color: var(--accent-hover);
    }

    .book-btn:disabled {
      background-color: #475569;
      cursor: not-allowed;
    }

    dialog {
      margin: auto;
      border: none;
      border-radius: 12px;
      background-color: var(--card-bg);
      color: var(--text);
      padding: 24px;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.7);
    }

    dialog h3 {
      margin-bottom: 12px;
      font-size: 1.3rem;
    }

    dialog p {
      color: var(--text-muted);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    dialog button {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      float: right;
    }
  </style>
</head>
<body>
  <div class="booking-container">
    <header>
      <h1>Select Your Seats</h1>
      <p>Pick a movie, choose your seats, and proceed to checkout</p>
    </header>

    <div class="movie-selection">
      <label for="movie">Pick a Movie</label>
      <select id="movie">
        <option value="14">Dune: Part Two ($14)</option>
        <option value="12">Oppenheimer ($12)</option>
        <option value="15">Spider-Man: Across the Spider-Verse ($15)</option>
        <option value="10">Past Lives ($10)</option>
      </select>
    </div>

    <div class="legend">
      <div class="legend-item"><div class="seat"></div> Available</div>
      <div class="legend-item"><div class="seat selected"></div> Selected</div>
      <div class="legend-item"><div class="seat occupied"></div> Booked</div>
    </div>

    <div class="screen-container">
      <div class="screen"></div>
      <div class="screen-label">Screen</div>
    </div>

    <div class="seating-chart" id="seatChart"></div>

    <div class="summary-card">
      <div>
        <div class="summary-text">
          Selected Seats: <span id="count">0</span>
        </div>
        <div class="total-price">
          Total: $<span id="total">0</span>
        </div>
      </div>
      <button class="book-btn" id="bookBtn" disabled>Confirm Booking</button>
    </div>
  </div>

  <dialog id="modal">
    <h3>Booking Confirmed!</h3>
    <p id="modalDetails"></p>
    <button onclick="document.getElementById('modal').close()">Done</button>
  </dialog>

  <script>
    const seatChart = document.getElementById("seatChart");
    const movieSelect = document.getElementById("movie");
    const countDisplay = document.getElementById("count");
    const totalDisplay = document.getElementById("total");
    const bookBtn = document.getElementById("bookBtn");
    const modal = document.getElementById("modal");
    const modalDetails = document.getElementById("modalDetails");

    const ROWS = 6;
    const SEATS_PER_ROW = 8;
    const occupiedSeats = ["0-2", "0-3", "2-4", "2-5", "4-1", "4-2"]; // mock booked seats

    let ticketPrice = Number(movieSelect.value);

    // Generate seat layout dynamically
    for (let r = 0; r < ROWS; r++) {
      const rowDiv = document.createElement("div");
      rowDiv.classList.add("seat-row");

      for (let s = 0; s < SEATS_PER_ROW; s++) {
        const seat = document.createElement("div");
        seat.classList.add("seat");
        seat.dataset.row = r;
        seat.dataset.seat = s;

        if (occupiedSeats.includes(`${r}-${s}`)) {
          seat.classList.add("occupied");
        }

        rowDiv.appendChild(seat);
      }
      seatChart.appendChild(rowDiv);
    }

    function updateSelection() {
      const selectedSeats = document.querySelectorAll(".seat-row .seat.selected");
      const selectedCount = selectedSeats.length;

      countDisplay.textContent = selectedCount;
      totalDisplay.textContent = selectedCount * ticketPrice;
      bookBtn.disabled = selectedCount === 0;
    }

    // Seat click listener
    seatChart.addEventListener("click", (e) => {
      if (
        e.target.classList.contains("seat") &&
        !e.target.classList.contains("occupied")
      ) {
        e.target.classList.toggle("selected");
        updateSelection();
      }
    });

    // Movie dropdown change listener
    movieSelect.addEventListener("change", (e) => {
      ticketPrice = Number(e.target.value);
      updateSelection();
    });

    // Booking submission
    bookBtn.addEventListener("click", () => {
      const selectedSeats = document.querySelectorAll(".seat-row .seat.selected");
      const movieTitle = movieSelect.options[movieSelect.selectedIndex].text.split(" (")[0];
      const count = selectedSeats.length;
      const total = count * ticketPrice;

      modalDetails.textContent = `You have booked ${count} ticket(s) for "${movieTitle}" totaling $${total}.`;
      modal.showModal();

      // Mark selected as occupied and reset state
      selectedSeats.forEach((seat) => {
        seat.classList.remove("selected");
        seat.classList.add("occupied");
      });
      updateSelection();
    });
  </script>
</body>
</html>
